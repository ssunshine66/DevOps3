name: Run unit tests and create tarball

on:
  push:
    branches: [branchAutoTest]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake make g++

      - name: Generate config scripts
        run: |
          aclocal
          autoconf
          automake --add-missing

      - name: Configure and build
        run: |
          ./configure
          make

      - name: Run unit tests
        run: make check

      - name: Create tarball distribution
        run: make dist
        