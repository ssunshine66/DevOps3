name: Create tarball distribution

on:
  push:
    branches: [branchAutoTest]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf automake make g++

    - name: Generate config scripts
      run: |
        aclocal
        autoconf
        automake --add-missing

    - name: Build and configure
      run: |
        ./configure
        make
        make check

    - name: Create tarball distribution
      run: make dist