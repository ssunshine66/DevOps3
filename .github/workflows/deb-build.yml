name: Build .deb package

on:
  push:
    branches: [ branchAutoPackage ]
  pull_request:
    branches: [ branchAutoPackage ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts autoconf automake

      - name: Generate autotools scripts
        run: |
          aclocal
          autoconf
          automake --add-missing

      - name: Configure and build
        run: |
          ./configure
          make

      - name: Build debian package
        run: |
          dpkg-buildpackage -us -uc
        
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
            name: debian-package
            path: ../*.deb
            

