name: deb action

on:
  push:
    branches: ["branchAutoPackage"]
  pull_request:
    branches: ["branchAutoPackage"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake make g++ dpkg-dev pkg-config

      - name: Generate config scripts
        run: |
          aclocal
          autoconf
          automake --add-missing

      - name: Build and configure
        run: |
          ./configure
          make

      - name: Build deb package
        run: dpkg-buildpackage -us -uc
        