name: Build .deb package

on:
  push:
    branches: [ branchAutoPackage ]

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper devscripts

      - name: Build debian package
        run: |
          dpkg-buildpackage -us -uc