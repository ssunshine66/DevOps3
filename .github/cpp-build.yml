name: C++ Build

on:
  push:
    branches: [ branchMake ]
  pull_request:
    branches: [ branchMake ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      run: sudo apt-get install -y build-essential

    - name: Build with Makefile
      run: make